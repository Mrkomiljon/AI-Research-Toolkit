[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-toolkit"
version = "1.4.0"
description = "Local-first, skill-based research workflow toolkit for Claude Code and OpenAI Codex (15 Agent Skills + deterministic Python engine)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mrkomiljon" }]
keywords = ["research", "agent-skills", "claude-code", "codex", "literature-review"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pymupdf>=1.24",
  "jinja2>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/Mrkomiljon/AI-Research-Toolkit"
Issues = "https://github.com/Mrkomiljon/AI-Research-Toolkit/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
ocr = ["docling>=2.0"]  # optional: OCR + layout for scanned PDFs (large download: PyTorch and models)

[project.scripts]
rtk = "research_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["research_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that call live scholarly APIs (skipped unless RTK_LIVE_API=1)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["B017"]
