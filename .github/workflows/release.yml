name: release

# Publishes the package to PyPI when a version tag (v1.2.3) is pushed.
# Requires the repository secret PYPI_API_TOKEN (PyPI "Add API token", scope: whole account for the first
# release, then narrow it to the project). Create the tag with:  git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test
        env:
          RTK_ALLOW_EXTERNAL_APIS: "0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
          ruff check .
          rtk validate-skills --skills-dir skills
          pytest -q
      - name: Check tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VER" || { echo "tag $TAG != pyproject version $VER"; exit 1; }
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
      - name: GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
